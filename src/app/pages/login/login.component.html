<div class="login-page">
  <form class="login-card" (submit)="$event.preventDefault(); onBotaoClicado()">
    <h1 class="login-titulo">FAÇA SEU LOGIN</h1>
    <p class="login-subtitulo">Digite seu CPF para acessar sua conta</p>

    <div class="campo">
      <label for="cpf">CPF</label>
      <input
        class="input-simples"
        id="cpf"
        name="cpf"
        type="text"
        inputmode="numeric"
        maxlength="11"
        placeholder="Somente números"
        autocomplete="username"
        (keyup)="onKeyUp('cpf', $event)"
      >
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        class="input-simples"
        id="senha"
        name="senha"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        (keyup)="onKeyUp('senha', $event)"
      >
    </div>

    <button
      class="botao-login"
      type="submit"
      [disabled]="botaoDesabilitado"
    >
      {{ textoBotao }}
    </button>
  </form>
</div>
