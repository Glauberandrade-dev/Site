<div class="login-page">
  <div class="login-card">
    <h1 class="abc">FAÇA SEU LOGIN</h1>

    <p class="informacao">Digite seu CPF para acessar sua conta</p>

  <input class="input-simples"
     placeholder="CPF"
     type="number"
     id="cpf"
     (keyup)="onKeyUp('cpf',$event)">

  <input class="input-simples"
     placeholder="SENHA"
     type="password"
     id="senha"
     (keyup)="onKeyUp('senha',$event)">
     
    <button class="input-submeter"
     [disabled]="botaoDesabilitado"
     (click)="onBotaoClicado()">
  {{ textoBotao }}
</button>
</div>
</div>
